<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coupa Procurement - DynamoDB Admin</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div class="container">
        <header class="topbar">
            <h1>Supplier Database</h1>
            <div class="actions">
                <button id="viewAllBtn" class="secondary" title="View all suppliers">View All Active</button>
                <button id="viewDeletedBtn" class="ghost" title="View deleted suppliers">View Inactive</button>
                <button id="createBtn" title="Create item">Create</button>
                <button id="updateBtn" class="secondary" title="Update item">Update</button>
                <button id="deleteBtn" class="danger" title="Delete item">Delete</button>
            </div>
        </header>

        <section class="config-hint">
            <p>
                Lets get friendly with your supplier database
            </p>
        </section>

        <section>
            <span id="status" class="status"></span>
        </section>

        <section class="form-section hidden" id="formSection">
            <h2 id="formTitle">Create Item</h2>
            <form id="itemForm">
                <div class="form-row">
                    <label for="pkInput" id="pkLabel">Partition Key</label>
                    <input id="pkInput" name="pk" type="text" placeholder="SAP vendor code" required />
                </div>
                <div class="form-row" id="skRow">
                    <label for="skInput" id="skLabel">Sort Key</label>
                    <input id="skInput" name="sk" type="text" placeholder="Plant Code" />
                </div>
                <div class="form-row" id="attributesRow">
                    <label for="attributesInput">Attributes</label>
                    <div id="attributesFields" class="hidden"></div>
                    <textarea id="attributesInput" name="attributes" rows="6" placeholder='{"name":"Item name","price":10}'></textarea>
                </div>
                <div class="form-row hidden" id="csvRow">
                    <label for="csvInput">CSV file (bulk upload)</label>
                    <input id="csvInput" name="csv" type="file" accept=".csv,text/csv" />
                    <div class="form-actions">
                        <button type="button" id="uploadCsvBtn" class="secondary">Upload CSV</button>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" id="saveBtn">Create</button>
                    <button type="button" id="cancelEditBtn" class="secondary hidden">Cancel Edit</button>
                </div>
            </form>
        </section>

        <section class="table-section hidden" id="tableSection">
            <h2>Items</h2>
            <div class="table-controls">
                <div id="conditions" class="conditions"></div>
                <button id="addConditionBtn" class="secondary small-btn">+</button>
                <button id="applyFilterBtn" class="secondary">Filter</button>
                <button id="clearFilterBtn" class="ghost">Clear</button>
                <span class="spacer"></span>
                <button type="button" id="deleteSelectedBtn" class="danger">Delete Selected</button>
                <button type="button" id="restoreSelectedBtn" class="secondary">Restore Selected</button>
                <button type="button" id="downloadAllBtn">Download All (CSV)</button>
                <button type="button" id="downloadFilteredBtn" class="secondary">Download Filtered (CSV)</button>
            </div>
            <div class="table-scroll">
                <table id="itemsTable" class="table">
                    <thead id="itemsThead">
                        <tr>
                            <th id="pkHeader">Partition Key</th>
                            <th id="skHeader">Sort Key</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTbody">
                        <tr>
                            <td colspan="3" class="muted">No data loaded yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination-controls">
                <label for="pageSizeSelect">Rows/page</label>
                <select id="pageSizeSelect" class="secondary">
                    <option value="10" selected>10</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <button type="button" id="prevPageBtn" class="secondary">Prev</button>
                <span id="pageInfo" class="muted">Page 1 / 1</span>
                <button type="button" id="nextPageBtn" class="secondary">Next</button>
            </div>
        </section>
    </div>

    <footer class="page-footer container">
        <small>Made for Coupa Procurement • DynamoDB Admin UI</small>
    </footer>

    <script src="./config.js"></script>
    <script src="./app.js?v=2025-01-15-1"></script>
</body>
</html>
